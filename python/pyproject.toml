[build-system]
requires = ["scikit-build-core>=0.5.0", "numpy>=1.20"]
build-backend = "scikit_build_core.build"

[project]
name = "pysif"
version = "0.1.0"
description = "Python bindings for the sif library"
authors = [
    { name = "Luca Palmieri", email = "luca.palmieri16@studio.unibo.it" },
]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://gitlab.com/lpalmi/sif"

[tool.scikit-build]
cmake.version = ">=3.15"
ninja.version = ">=1.5"
build-dir = "build/{wheel_tag}"

cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
# Stated rather than inherited, so that what a pysif build does about HDF5 is
# written down here. AUTO takes HDF5 when the machine has a serial one; a
# wheel built for distribution should say ON (and bundle the library), so
# that it cannot silently ship without it. Override with
#   pip install . -C cmake.define.SIF_HDF5_SUPPORT=ON
SIF_HDF5_SUPPORT = "AUTO"

wheel.packages = ["pysif"]
