# Every push to main and every pull request: the test suite, the Python
# bindings, and a docs build. Nothing is published from here; releases are
# release.yml's business, and only on a version tag.

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The library and its test suite, once for each HDF5 mode.
  #
  # Both modes run because each compiles code the other never sees: src/io/
  # hdf5.c against src/io/hdf5_off.c, and the tests' #ifdef SIF_HAVE_HDF5
  # halves. A change that only builds in one of them is exactly what a single
  # job would let through.
  #
  # HDF5 is installed in both. With ON it is required; with OFF it has to be
  # ignored even though it is there -- which the OFF job checks by looking for
  # any HDF5 symbol the library references, since "OFF" is a promise that a
  # project embedding sif never links HDF5 at all.
  #
  # GCC's libgomp and Debian's FFTW (built against the same runtime) make the
  # default SIF_FFTW_THREADING=omp safe here; see the note in CMakeLists.txt.
  c-library:
    name: C library (HDF5 ${{ matrix.hdf5 }})
    runs-on: ubuntu-24.04
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        hdf5: ["ON", "OFF"]
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake libfftw3-dev libhdf5-dev binutils \
            git ca-certificates
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DSIF_HDF5_SUPPORT=${{ matrix.hdf5 }}
          cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Check that OFF links no HDF5
        if: matrix.hdf5 == 'OFF'
        run: |
          if nm -u build/libsif.a | grep -q ' H5'; then
            echo "::error::libsif.a references HDF5 in an OFF build"
            exit 1
          fi

  # The suite under ThreadSanitizer, for the races that happen not to change a
  # result on the run that tested it -- test_thread_invariance catches the
  # ones that do.
  #
  # Clang and LLVM's libomp rather than GCC: TSan only sees OpenMP's barriers
  # and reductions through LLVM's archer tool, loaded with OMP_TOOL_LIBRARIES,
  # and libgomp has nothing like it. FFTW on its pthreads backend, since
  # Debian's OpenMP FFTW is built against libgomp, and two OpenMP runtimes in
  # one process is a fault of its own. Debug, so the reports have lines.
  tsan:
    name: C library (ThreadSanitizer)
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang libclang-rt-dev libomp-dev llvm cmake make libfftw3-dev \
            git ca-certificates
      - uses: actions/checkout@v7
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug \
            -DSIF_SANITIZE=thread -DSIF_HDF5_SUPPORT=OFF \
            -DSIF_FFTW_THREADING=threads -DSIF_NATIVE_ARCH=OFF
          cmake --build build -j "$(nproc)"
      - name: Test
        run: |
          OMP_TOOL_LIBRARIES="$(find /usr/lib -name 'libarcher.so*' | head -1)"
          test -n "$OMP_TOOL_LIBRARIES"
          export OMP_TOOL_LIBRARIES
          # libomp itself is not instrumented, and its internals read as
          # races unless TSan is told to ignore modules it did not build.
          export TSAN_OPTIONS="halt_on_error=1 second_deadlock_stack=1 ignore_noninstrumented_modules=1"
          ctest --test-dir build --output-on-failure --timeout 1800

  # The bindings, built the way `pip install .` builds them: the same smoke
  # test the release wheels must pass, then the binding tests in tests/python.
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfftw3-dev libhdf5-dev libcfitsio-dev
      # FITS=ON rather than AUTO: the smoke test reads a FITS file, and AUTO
      # without cfitsio builds a pysif that only fails once it gets there.
      - name: Build and install pysif
        run: |
          pip install . -C cmake.define.SIF_HDF5_SUPPORT=ON \
            -C cmake.define.SIF_FITS_SUPPORT=ON
      - name: Smoke test
        run: |
          pip install h5py
          cd /tmp && python "$GITHUB_WORKSPACE/packaging/test_wheel.py"
      # From /tmp, so `import pysif` is the installed module and not anything
      # in the checkout.
      - name: Tests
        run: |
          pip install pytest
          cd /tmp && python -m pytest -p no:cacheprovider \
            "$GITHUB_WORKSPACE/tests/python"

  # Hawkmoth parses the public headers with libclang for the C API pages, and
  # autodoc imports pysif for the Python API pages, so the library must be
  # built and installed before Sphinx runs.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfftw3-dev libhdf5-dev
      - run: pip install -r docs/requirements.txt
      - name: Build and install pysif
        run: pip install . -C cmake.define.SIF_HDF5_SUPPORT=ON
      - run: sphinx-build -b html -W --keep-going docs _build/html
