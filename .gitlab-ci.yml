stages:
  - test
  - docs

# Build the library and run the test suite, once for each HDF5 mode.
#
# Both modes run because each compiles code the other never sees: src/io/
# hdf5.c against src/io/hdf5_off.c, and the tests' #ifdef SIF_HAVE_HDF5
# halves. A change that only builds in one of them is exactly what a single
# job would let through.
#
# HDF5 is installed in both. With ON it is required; with OFF it has to be
# ignored even though it is there -- which the OFF job checks by looking for
# any HDF5 symbol the library references, since "OFF" is a promise that a
# project embedding sif never links HDF5 at all.
#
# GCC's libgomp and Debian's FFTW (built against the same runtime) make the
# default SIF_FFTW_THREADING=omp safe here; see the note in CMakeLists.txt.
.build-and-test:
  stage: test
  image: debian:trixie
  variables:
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends
        build-essential cmake libfftw3-dev libhdf5-dev binutils
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        -DSIF_HDF5_SUPPORT=${SIF_HDF5_SUPPORT}
    - cmake --build build -j "$(nproc)"
    - ctest --test-dir build --output-on-failure
    # In script rather than after_script, whose failures GitLab ignores.
    - if [ "$SIF_HDF5_SUPPORT" = "OFF" ] && nm -u build/libsif.a | grep -q ' H5'; then
        echo "libsif.a references HDF5 in an OFF build"; exit 1;
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test:hdf5-on:
  extends: .build-and-test
  variables:
    SIF_HDF5_SUPPORT: "ON"

test:hdf5-off:
  extends: .build-and-test
  variables:
    SIF_HDF5_SUPPORT: "OFF"

# The documentation site, published to GitLab Pages.
#
# Hawkmoth parses the public headers with libclang, so this job needs C system
# headers to resolve <stdint.h> and friends -- which is why the image is the
# full python one rather than -slim. It does *not* need to build the library:
# nothing here is compiled, and no sif object is imported. That changes if the
# Python API pages are ever switched on; see docs/api/python.md.
pages:
  stage: docs
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r docs/requirements.txt
  script:
    - sphinx-build -b html -W --keep-going docs public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Same build on a merge request, so a broken docs change is caught before it
# lands. Publishes nothing.
docs:check:
  stage: docs
  image: python:3.12
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r docs/requirements.txt
  script:
    - sphinx-build -b html -W --keep-going docs _build/html
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
